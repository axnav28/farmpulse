        <h1>FarmPulse</h1>
        <p>
          FarmPulse is a pan-India crop early warning platform for government departments, extension officers,
          FPOs, and insurers. It combines district-level NDVI stress monitoring, weather analysis, pest-risk reasoning,
          institutional reporting, and a full audit trail.
        </p>
        <h2>Main Routes</h2>
        <ul>
          <li><strong>/overview</strong>: default landing page with live agent statuses, map views, and recent activity.</li>
          <li><strong>/institutional</strong>: state prioritization, extension targeting, and briefing exports.</li>
          <li><strong>/districts</strong>: district-level explorer with risk reports, intervention priority, and recommended institutional action.</li>
          <li><strong>/audit</strong>: chronological audit trail of every agent action and escalation.</li>
        </ul>
        <h2>Flagship Demo</h2>
        <p>
          The centerpiece flow detects crop stress 2-3 weeks before visible damage and routes alerts to departments,
          FPOs, insurers, and extension teams so interventions happen earlier and losses are reduced.
        </p>
